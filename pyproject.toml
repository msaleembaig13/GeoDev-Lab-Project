[project]
name = "geoclean"
version = "0.1.0"
description = "Geospatial data analysis and cleaning project"
readme = "README.md"
authors = [
    { name = "M Saleem Baig", email = "msalimbaig13@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "geopandas",
    "rasterio",
    "matplotlib",
]

[project.scripts]
geoclean = "geoclean.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
